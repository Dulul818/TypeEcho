# Copy the trained checkpoint paths here before starting the official api_v2.py.
# Relative pretrained paths are resolved from the GPT-SoVITS repository directory.
custom:
  version: v2ProPlus
  device: cuda
  is_half: true
  t2s_weights_path: D:/Models/your-trained-gpt.ckpt
  vits_weights_path: D:/Models/your-trained-sovits.pth
  bert_base_path: GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large
  cnhuhbert_base_path: GPT_SoVITS/pretrained_models/chinese-hubert-base
